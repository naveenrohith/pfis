name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check backend/app tests

      - name: Black (format check)
        run: black --check backend/app tests

      - name: Mypy (type check, non-blocking)
        run: mypy backend/app
        continue-on-error: true

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
        if: always()

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

      - name: Enforce bundle budgets
        run: npm run quality:bundle

      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run functional browser regression
        working-directory: frontend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./pfis-e2e.db
          SECRET_KEY: ci-e2e-secret-key-not-used-outside-tests
          TOKEN_ENCRYPTION_KEY: ""
          AUTH_REQUIRED: "false"
          ALLOW_DEMO_LOGIN: "true"
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
